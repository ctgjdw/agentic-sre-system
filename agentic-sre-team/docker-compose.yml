name: agentic-sre-team

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sre-postgres
    environment:
      POSTGRES_DB: sre
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: ${SRE_PG_PASSWORD:-sre}
    ports:
      - "5433:5432"
    volumes:
      - sre-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d sre"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: ./gateway
    container_name: sre-gateway
    command: ["sh", "-c", "alembic upgrade head && uvicorn sre_gateway.main:app --host 0.0.0.0 --port 8080"]
    env_file: .env
    environment:
      SRE_DATABASE_URL: postgresql+asyncpg://sre:${SRE_PG_PASSWORD:-sre}@postgres:5432/sre
      SRE_CONFIG_DIR: /config
      SRE_MODELS_PROFILE: ${SRE_MODELS_PROFILE:-local}
      SRE_HOLMES_URL: ${SRE_HOLMES_URL:-http://holmes:5050}
      SRE_FAKE_SCRIPT_DIR: ${SRE_FAKE_SCRIPT_DIR:-}
      # Interpolated here (not just via env_file) so the environment block wins over
      # env_file: `make smoke`/`make e2e` export SRE_TELEGRAM_ENABLED=false to force the
      # fake profile onto LogChannel even when .env carries real creds; `make up` inherits
      # the .env value (true when the operator enables the bot).
      SRE_TELEGRAM_ENABLED: ${SRE_TELEGRAM_ENABLED:-false}
      # ADC path inside the container (mounted below); overrides the host path in .env
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json
    volumes:
      - ./config:/config:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/secrets/gcp.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  holmes:
    # Real evidence sidecar. Behind the "live" profile so `--profile fake`/`make smoke`
    # (which run fake-holmes on the same port 5050) and plain `compose config` on a
    # clean checkout are never affected by it.
    profiles: ["live"]
    image: ${HOLMES_IMAGE}
    container_name: sre-holmes
    entrypoint: ["python", "server.py"]
    # Least-privilege: this container executes model-directed tools and exposes an
    # unauthenticated API, so it gets ONLY the vars its read-only toolset manifest needs -
    # never the full .env (no Telegram/GitHub/GitLab/PG/webhook/LangSmith secrets).
    # Values are interpolated from ./.env at compose time; empty defaults keep boot green.
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /creds/adc.json
      VERTEXAI_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEXAI_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      SRE_GRAFANA_URL: ${SRE_GRAFANA_URL:-}
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_AUTH: ${GRAFANA_PROM_AUTH:-}
      GRAFANA_SA_TOKEN: ${GRAFANA_SA_TOKEN:-}
      GRAFANA_TEMPO_DS_UID: ${GRAFANA_TEMPO_DS_UID:-}
      GRAFANA_MCP_URL: ${GRAFANA_MCP_URL:-}
      TARGET_OPENSEARCH_URL: ${TARGET_OPENSEARCH_URL:-}
      TARGET_PG_RO_URL: ${TARGET_PG_RO_URL:-}
    volumes:
      - ./config/holmes.yaml:/root/.holmes/config.yaml:ro
      # Default to /dev/null so a blank var (as in .env.example) doesn't make the whole
      # compose file invalid. No docker.sock mount: `:ro` does not restrict a socket
      # (root-equivalent), and the docker/core toolset is disabled anyway.
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/creds/adc.json:ro
    ports:
      - "127.0.0.1:5050:5050"   # loopback only: unauthenticated API proxying live creds
    # For Spectre-internal evidence (opensearch/PG reached by container hostname), also
    # attach this service to the target env's network (e.g. spectre_default).

  ui:
    # Ops console (nginx serving the static build + proxying /api/ to the gateway).
    # Behind its own "ui" profile so `make smoke` (--profile fake) stays gateway-only
    # and never rebuilds the frontend; `make up`/`up-fake` add --profile ui.
    profiles: ["ui"]
    build: ./ui
    container_name: sre-ui
    ports:
      - "8088:80"
    depends_on:
      - gateway

  fake-holmes:
    profiles: ["fake"]
    build: ./gateway
    container_name: sre-fake-holmes
    command: ["python", "-m", "sre_gateway.testing.fake_holmes"]
    environment:
      FAKE_HOLMES_DIR: /app/tests/fixtures/holmes/incident_error_storm
    ports:
      - "5050:5050"

volumes:
  sre-pg:
